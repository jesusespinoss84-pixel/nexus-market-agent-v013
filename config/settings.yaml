  - 3.0
  - 4.0
  - 5.0
  slippage_values:
  - 0.05
  - 0.1
  commission_pct_round_trip: 0.02
  max_bars_in_trade: 20
  min_trades_for_stability: 20
storage:
  state: storage/agent_state.json
  snapshot: storage/watchlist_snapshot.json
  benchmarks: storage/benchmarks.json
  sensitivity: storage/sensitivity_results.csv
  sensitivity_summary: storage/sensitivity_summary.json
  portfolio: storage/paper_portfolio.json
  equity_curve: storage/equity_curve.json
  cache_dir: storage/cache
  validations_dir: storage/validations
  market_intelligence: storage/market_intelligence.json
  trade_events: storage/paper_trade_events.json
  runtime: storage/runtime.json
  decision_log: storage/decision_log.json
  alert_feed: storage/alert_feed.json
  decision_state: storage/decision_state.json
  learning_samples: storage/learning_samples.json
  learning_summary: storage/learning_summary.json
  learning_state: storage/learning_state.json
  learning_audit: storage/learning_audit.json
  learning_counterfactual: storage/learning_counterfactual.json
  learning_calibration: storage/learning_calibration.json
  risk_governor: storage/risk_governor.json
  stress_test: storage/stress_test.json
validation:
  enabled: true
  auto_validate: true
  cache_hours: 24
  period: 2y
  interval: 1h
  min_trades: 20
  walk_forward_folds: 5
  max_auto_per_scan: 2
  prefilter:
    min_technical: 65
    min_viability: 45
    max_vulnerability: 85
  validated_thresholds:
    min_trades: 20
    min_pf: 1.25
    min_exp_r: 0.1
    min_robustness: 60
    min_positive_folds: 3
  quick_grid:
    rsi_values:
    - 70
    - 75
    - 80
    sma20_distance_values:
    - 1.0
    - 2.0
    - 3.0
    score_values:
    - 65
    - 70
    - 75
    stop_values:
    - 1.5
    - 2.0
    target_values:
    - 3.0
    - 4.0
    - 5.0
    slippage_values:
    - 0.05
market_intelligence:
  enabled: true
  relative_strength_period_days: 63
  abnormal_volume_days: 20
  sector_weight: 0.3
  relative_strength_weight: 0.3
  volume_weight: 0.15
  volatility_weight: 0.15
  earnings_weight: 0.1
  news_sentiment:
    enabled: true
    mode: informational
    note: Contexto informativo; no sustituye validación histórica ni convierte el
      score en probabilidad.

autonomous_agent:
  enabled: true
  paper_only: true
  auto_open: true
  auto_close_on_pause: true
  min_validation_score: 60
  min_composite_score: 65
  min_ai_strength: 62
  max_vulnerability_for_entry: 60
  pause_vulnerability: 85
  pause_market_context: 20
  alert_on_action_change: true
  alert_on_setup_detected: true
  decision_log_max: 5000
  alert_feed_max: 1000

alerts:
  browser_enabled: true
  telegram_enabled: true
  telegram_bot_token_env: NEXUS_TELEGRAM_BOT_TOKEN
  telegram_chat_id_env: NEXUS_TELEGRAM_CHAT_ID
  alert_on_paper_candidate: true
  alert_on_pause: true
  alert_on_trade_event: true
  alert_on_opportunity: true
  alert_on_bridge_status_change: true
  alert_on_scan_status_change: true
  bridge_stale_seconds: 120
  daily_summary_enabled: true
  daily_summary_hour_local: 18
  daily_summary_timezone: America/Matamoros
  note: "Alertas PAPER/operativas. No son recomendaciones de inversión ni probabilidades de ganancia."

real_trading:
  enabled: false
  execution_mode: manual_confirmation_only
  broker: null
  note: "La ejecución real permanece deshabilitada hasta configurar un intermediario compatible y autorizado. NEXUS no ejecuta órdenes reales de forma autónoma."

learning_agent:
  enabled: true
  paper_only: true
  sample_interval_minutes: 60
  duplicate_same_decision_minutes: 240
  counterfactual_move_threshold_pct: 0.50
  horizons_minutes: [60, 1440, 7200]
  max_samples: 20000
  min_samples_for_adjustment: 30
  adjustment_horizon_minutes: 1440
  max_ai_adjustment_points: 3.0
  min_samples_per_symbol: 12
  min_samples_per_regime: 20
  min_samples_candidate_review: 40
  candidate_min_hit_rate_pct: 58
  candidate_min_avg_return_pct: 0.15
  auto_change_strategy_weights: false
  evidence_levels:
    initial: 8
    moderate: 20
    solid: 50
  friction_model:
    enabled: true
    use_paper_portfolio_costs: true
    fx_buffer_pct_us: 0.05
  calibration_max_adjustment_points: 3.0
  note: "Aprendizaje en sombra: evalúa decisiones PAPER y aplica como máximo un ajuste pequeño al score interno cuando existe muestra suficiente. No habilita trading real ni modifica estrategias validadas."

paper_test_campaign:
  enabled: false
  paper_only: true
  label: PLUMBING_TEST
  max_open_test_positions: 2
  budget_mxn_per_trade: 1500
  min_technical_score: 70
  min_composite_score: 50
  max_vulnerability_score: 75
  stop_loss_pct: 1.0
  take_profit_pct: 2.0
  max_hold_minutes: 60
  cooldown_minutes_after_close: 15
  note: "Campana temporal para comprobar el ciclo tecnico PAPER. Sus resultados NO validan una estrategia y NO habilitan trading real."

risk_governor:
  enabled: true
  paper_only: true
  max_total_exposure_pct: 70
  max_sector_exposure_pct: 40
  daily_loss_caution_pct: 1.5
  daily_loss_defensive_pct: 2.5
  daily_loss_pause_pct: 4.0
  drawdown_caution_pct: 3.0
  drawdown_defensive_pct: 5.0
  drawdown_pause_pct: 8.0
  block_new_entries_in_defensive: true
  block_new_entries_in_pause: true
  stress_scenarios:
    - {name: CAIDA_BRUSCA, shock_pct: -8, slippage_multiplier: 3.0}
    - {name: VOLATILIDAD_ALTA, shock_pct: -4, slippage_multiplier: 5.0}
    - {name: FX_ADVERSO_US, shock_pct: -3, fx_shock_pct: -5, slippage_multiplier: 2.0}

# V0.17 — Broker Gateway. Lectura/preview solamente; nunca transmite órdenes reales.
broker_gateway:
  enabled: false
  provider: IBKR
  mode: read_preview_only
  base_url: https://localhost:5000/v1/api
  account_id: null
  verify_tls: false
  audit_file: storage/broker_audit.json
  audit_max: 2000
  live_order_transmission: false
  manual_confirmation_required: true
