validated_strategies:
- id: NVDA_RSI75_SMA20_2
  symbol: NVDA
  direction: BUY
  min_score: 65
  rsi14_min: 75
  distance_sma20_pct_min: 2.0
  robustness_score: 69.3
  profit_factor: 1.748
  expectancy_r: 0.326
  walk_forward: 4/5
risk:
  stop_loss_pct: 2.0
  take_profit_pct: 4.0
sensitivity:
  symbol: NVDA
  period: 2y
  interval: 1h
  rsi_values:
  - 70
  - 72.5
  - 75
  - 77.5
  - 80
  sma20_distance_values:
  - 1.0
  - 1.5
  - 2.0
  - 2.5
  - 3.0
  score_values:
  - 60
  - 65
  - 70
  - 75
  stop_values:
  - 1.5
  - 2.0
  - 2.5
